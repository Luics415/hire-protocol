services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: job_security_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
      - path: ./backend/.env
        required: false
    volumes:
      - ./backend/data:/app/data
    networks:
      - app_network

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: job_security_n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=America/Mexico_City
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/data/workflows:ro
    depends_on:
      - backend
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  n8n_data:
